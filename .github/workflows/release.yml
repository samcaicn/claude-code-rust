name: Release

on:
  push:
    branches: [claude]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.11.3)'
        required: true
        default: 'v0.11.3'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS (x86_64)
    runs-on: macos-13
    strategy:
      fail-fast: false
    env:
      target: x86_64-apple-darwin
      arch: x86_64

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build agent-sdk
        run: |
          npm install --prefix agent-sdk
          npm run build --prefix agent-sdk

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: |
          cargo build --release --target ${{ env.target }} --bin claude-rs
          ls -la target/${{ env.target }}/release/claude-rs

      - name: Bundle bridge script
        run: |
          mkdir -p target/${{ env.target }}/release/agent-sdk/dist
          cp -r agent-sdk/dist/bridge.js target/${{ env.target }}/release/agent-sdk/dist/
          cp -r agent-sdk/dist/types.js target/${{ env.target }}/release/agent-sdk/dist/
          ls -la target/${{ env.target }}/release/agent-sdk/dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-rs-${{ env.arch }}-apple-darwin
          path: target/${{ env.target }}/release/
          retention-days: 5
